<!DOCTYPE html> <html lang="fa" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title> ⌨️ تمرین تایپ هوشمند </title> <style> *{ margin:0; padding:0; box-sizing:border-box; } :root{ --bg:#eef4ff; --card:#ffffff; --primary:#4f46e5; --primary2:#6d5dfc; --green:#16a34a; --green2:#15803d; --text:#183153; --muted:#6b7a90; --border:#d9e5f5; } body{ font-family: Tahoma, sans-serif; background: linear-gradient( 135deg, #eef4ff, #dfeeff ); min-height:100vh; padding: 80px 14px 40px; color:var(--text); } /* ====================== HEADER ====================== */ .header{ position:fixed; top:0; left:0; right:0; height:62px; background: rgba(24,49,83,.9); backdrop-filter:blur(12px); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1rem; color:white; z-index:1000; box-shadow: 0 4px 20px rgba(0,0,0,.08); } /* ====================== LAYOUT ====================== */ .container{ max-width:760px; margin:auto; } .card{ background:var(--card); border-radius:34px; padding:18px; box-shadow: 0 12px 40px rgba(0,0,0,.06); border: 1px solid rgba(255,255,255,.6); } /* ====================== SENTENCE ====================== */ .sentence-box{ background: linear-gradient( 135deg, #edf4ff, #f8fbff ); padding:22px; border-radius:28px; margin-bottom:16px; border: 1px solid #dfe9f8; min-height:140px; display:flex; align-items:center; justify-content:center; text-align:center; line-height:2; font-size:1.35rem; font-weight:800; color:#163254; } /* ====================== INPUT ====================== */ .input-wrapper{ margin-bottom:14px; } .user-input{ width:100%; padding:16px 18px; border-radius:22px; border: 2px solid var(--border); background:white; font-size:1rem; outline:none; transition:.2s; } .user-input:focus{ border-color:var(--primary); box-shadow: 0 0 0 5px rgba(79,70,229,.08); } /* ====================== BUTTONS ====================== */ .action-section{ display:flex; flex-direction:column; gap:14px; } .primary-buttons{ display:grid; grid-template-columns:1fr 1fr; gap:12px; } .btn{ border:none; cursor:pointer; border-radius:24px; font-family:inherit; transition:.2s; } .btn:active{ transform:scale(.97); } /* check */ .btn-check{ background: linear-gradient( 135deg, var(--green), var(--green2) ); padding:16px; font-size:.95rem; font-weight:800; color:white; box-shadow: 0 10px 24px rgba(22,163,74,.22); } /* reset */ .btn-reset{ background:white; padding:16px; font-size:.95rem; font-weight:800; color:#284567; border: 1.5px solid var(--border); box-shadow: 0 5px 14px rgba(0,0,0,.04); } /* generate */ .btn-generate{ width:100%; background: linear-gradient( 135deg, var(--primary2), var(--primary) ); padding:18px; display:flex; align-items:center; gap:14px; color:white; position:relative; overflow:hidden; box-shadow: 0 16px 34px rgba(79,70,229,.28); } .btn-generate::before{ content:""; position:absolute; inset:0; background: linear-gradient( 90deg, transparent, rgba(255,255,255,.18), transparent ); transform:translateX(-100%); transition:.8s; } .btn-generate:hover::before{ transform:translateX(100%); } .generate-icon{ width:54px; height:54px; border-radius:18px; background: rgba(255,255,255,.15); display:flex; align-items:center; justify-content:center; font-size:1.5rem; flex-shrink:0; backdrop-filter:blur(10px); } .generate-content{ display:flex; flex-direction:column; align-items:flex-start; text-align:right; } .generate-title{ font-size:1rem; font-weight:800; } .generate-subtitle{ font-size:.75rem; opacity:.9; margin-top:4px; line-height:1.6; } /* ====================== RESULT ====================== */ .result{ margin-top:14px; padding:14px; border-radius:22px; background:#f3f7ff; font-weight:700; text-align:center; line-height:1.8; min-height:60px; display:flex; align-items:center; justify-content:center; } /* ====================== INFO ====================== */ .info{ margin-top:14px; display:flex; justify-content:space-between; align-items:center; background:#edf4ff; padding:14px; border-radius:22px; font-size:.9rem; font-weight:700; color:#27476e; } /* ====================== MOBILE ====================== */ @media(max-width:520px){ .primary-buttons{ grid-template-columns:1fr; } .sentence-box{ font-size:1.15rem; padding:18px; } } </style> </head> <body> <!-- HEADER --> <div class="header"> ⌨️ تمرین تایپ هوشمند حرفه‌ای </div> <!-- CONTENT --> <div class="container"> <div class="card"> <!-- sentence --> <div class="sentence-box" id="sentenceDisplay"> درحال بارگذاری... </div> <!-- input --> <div class="input-wrapper"> <input type="text" class="user-input" id="userInput" placeholder="جمله را اینجا تایپ کن..." autocomplete="off"> </div> <!-- buttons --> <div class="action-section"> <div class="primary-buttons"> <button class="btn btn-check" id="checkBtn"> ✔ بررسی پاسخ </button> <button class="btn btn-reset" id="resetBtn"> ↺ شروع دوباره </button> </div> <button class="btn btn-generate" id="generateBtn"> <div class="generate-icon"> ✨ </div> <div class="generate-content"> <span class="generate-title"> دریافت ۵۰ جمله جدید </span> <span class="generate-subtitle"> جملات واقعی فارسی از اینترنت + افزایش سختی مرحله‌ها </span> </div> </button> </div> <!-- result --> <div class="result" id="resultMsg"> 👆 جمله را تایپ و بررسی کن </div> <!-- info --> <div class="info"> <span id="progressText"> مرحله ۱ </span> <span id="levelText"> سطح ۱ </span> </div> </div> </div> <script> /* ========================= STORAGE ========================= */ const STORAGE_KEY = "typing_sentences_pro"; const PROGRESS_KEY = "typing_progress_pro"; const LEVEL_KEY = "typing_level_pro"; /* ========================= STATE ========================= */ let sentences = [ "بابا آب داد", "علی فوتبال بازی کرد", "هوا امروز عالی است" ]; let currentIndex = 0; let generationLevel = 1; /* ========================= ELEMENTS ========================= */ const sentenceDisplay = document.getElementById( "sentenceDisplay" ); const userInput = document.getElementById( "userInput" ); const resultMsg = document.getElementById( "resultMsg" ); const progressText = document.getElementById( "progressText" ); const levelText = document.getElementById( "levelText" ); const generateBtn = document.getElementById( "generateBtn" ); /* ========================= SAVE / LOAD ========================= */ function saveData(){ localStorage.setItem( STORAGE_KEY, JSON.stringify(sentences) ); localStorage.setItem( PROGRESS_KEY, currentIndex ); localStorage.setItem( LEVEL_KEY, generationLevel ); } function loadData(){ const saved = localStorage.getItem(STORAGE_KEY); if(saved){ sentences = JSON.parse(saved); } const savedProgress = localStorage.getItem(PROGRESS_KEY); if(savedProgress){ currentIndex = parseInt(savedProgress); } const savedLevel = localStorage.getItem(LEVEL_KEY); if(savedLevel){ generationLevel = parseInt(savedLevel); } } /* ========================= UI ========================= */ function updateUI(){ sentenceDisplay.innerText = sentences[currentIndex]; progressText.innerText = `مرحله ${currentIndex + 1} از ${sentences.length}`; levelText.innerText = `سطح ${generationLevel}`; userInput.value = ""; } /* ========================= CHECK ========================= */ function checkAnswer(){ const typed = userInput.value.trim(); const correct = sentences[currentIndex]; if(typed === correct){ resultMsg.innerHTML = "✅ عالی بود"; resultMsg.style.background = "#dff7e7"; setTimeout(()=>{ currentIndex++; if( currentIndex >= sentences.length ){ currentIndex = 0; } saveData(); updateUI(); },1200); }else{ resultMsg.innerHTML = `❌ پاسخ صحیح: <br><br> ${correct}`; resultMsg.style.background = "#ffe3e3"; } } /* ========================= RESET ========================= */ function resetProgress(){ currentIndex = 0; saveData(); updateUI(); resultMsg.innerHTML = "🔄 از ابتدا شروع شد"; resultMsg.style.background = "#eef4ff"; } /* ========================= FETCH REAL SENTENCES ========================= */ async function generateNewSentences(){ generateBtn.disabled = true; resultMsg.innerHTML = "🌐 درحال دریافت جملات واقعی..."; resultMsg.style.background = "#eef4ff"; try{ const requests = []; // 10 مقاله تصادفی for(let i=0;i<10;i++){ requests.push( fetch( "https://fa.wikipedia.org/api/rest_v1/page/random/summary" ) .then(r=>r.json()) ); } const results = await Promise.all(requests); let newSentences = []; results.forEach(data=>{ if(data.extract){ let parts = data.extract .split(/[.!؟]/); parts.forEach(p=>{ let t = p.trim(); if( t.length > 25 && t.length < 120 ){ newSentences.push(t); } }); } }); // افزایش سختی if(generationLevel >= 3){ newSentences = newSentences.filter( s => s.length > 45 ); } if(generationLevel >= 5){ newSentences = newSentences.filter( s => s.length > 70 ); } // فقط 50 تا newSentences = newSentences.slice(0,50); // fallback if(newSentences.length === 0){ newSentences = [ "هوش مصنوعی آینده فناوری را تغییر خواهد داد", "برنامه نویسی مهارتی ارزشمند برای آینده محسوب می‌شود", "مطالعه روزانه موجب رشد ذهن انسان خواهد شد" ]; } sentences.push( ...newSentences ); generationLevel++; saveData(); resultMsg.innerHTML = `🚀 ${newSentences.length} جمله جدید اضافه شد`; resultMsg.style.background = "#dff7e7"; updateUI(); }catch(error){ console.log(error); resultMsg.innerHTML = "❌ خطا در دریافت جملات"; resultMsg.style.background = "#ffe3e3"; } generateBtn.disabled = false; } /* ========================= EVENTS ========================= */ document .getElementById("checkBtn") .addEventListener( "click", checkAnswer ); document .getElementById("resetBtn") .addEventListener( "click", resetProgress ); generateBtn .addEventListener( "click", generateNewSentences ); userInput.addEventListener( "keypress", e=>{ if(e.key === "Enter"){ checkAnswer(); } } ); /* ========================= START ========================= */ loadData(); updateUI(); </script> </body> </html>
