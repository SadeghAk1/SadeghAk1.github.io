<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
⌨️ تمرین تایپ هوشمند
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{

--bg:#eef4ff;
--card:#ffffff;
--primary:#4f46e5;
--primary2:#6d5dfc;
--green:#16a34a;
--green2:#15803d;
--text:#183153;
--muted:#6b7a90;
--border:#d9e5f5;

}

body{

font-family:
Tahoma,
sans-serif;

background:
linear-gradient(
135deg,
#eef4ff,
#dfeeff
);

min-height:100vh;

padding:
80px 14px 40px;

color:var(--text);

}

/* =======================
HEADER
======================= */

.header{

position:fixed;

top:0;
left:0;
right:0;

height:64px;

background:
rgba(24,49,83,.92);

backdrop-filter:blur(12px);

display:flex;
align-items:center;
justify-content:center;

color:white;

font-weight:800;

z-index:1000;

box-shadow:
0 4px 20px rgba(0,0,0,.08);

}

.menu-btn{

position:absolute;

right:14px;

width:42px;
height:42px;

border:none;

border-radius:14px;

background:
rgba(255,255,255,.12);

color:white;

font-size:1.2rem;

cursor:pointer;

}

/* =======================
SIDEBAR
======================= */

#sidebar{

position:fixed;

top:0;
right:-320px;

width:280px;
height:100vh;

background:white;

padding:24px;

transition:.3s;

z-index:2000;

box-shadow:
-10px 0 40px rgba(0,0,0,.12);

border-radius:
32px 0 0 32px;

overflow:auto;

}

#sidebar.show{

right:0;

}

.menu-title{

font-size:1.3rem;
font-weight:800;

margin-bottom:22px;

}

.menu-item{

width:100%;

padding:16px;

margin-top:12px;

border:none;

border-radius:20px;

background:#eef4ff;

font-weight:700;

cursor:pointer;

font-size:.95rem;

transition:.2s;

text-align:right;

}

.menu-item:hover{

transform:translateX(-4px);

background:#dde9ff;

}

#overlay{

position:fixed;
inset:0;

background:
rgba(0,0,0,.45);

backdrop-filter:blur(4px);

opacity:0;

pointer-events:none;

transition:.25s;

z-index:1500;

}

#overlay.show{

opacity:1;

pointer-events:auto;

}

/* =======================
CONTAINER
======================= */

.container{

max-width:760px;
margin:auto;

}

.card{

background:white;

border-radius:34px;

padding:18px;

box-shadow:
0 12px 40px rgba(0,0,0,.06);

}

/* =======================
SENTENCE
======================= */

.sentence-box{

background:
linear-gradient(
135deg,
#edf4ff,
#f8fbff
);

padding:24px;

border-radius:28px;

min-height:180px;

display:flex;
align-items:center;
justify-content:center;

text-align:center;

line-height:2;

font-size:1.3rem;

font-weight:800;

margin-bottom:16px;

}

/* =======================
INPUT
======================= */

.user-input{

width:100%;

padding:16px;

border-radius:22px;

border:
2px solid var(--border);

font-size:1rem;

outline:none;

margin-bottom:16px;

}

.user-input:focus{

border-color:var(--primary);

}

/* =======================
BUTTONS
======================= */

.action-section{

display:flex;
flex-direction:column;
gap:14px;

}

.primary-buttons{

display:grid;
grid-template-columns:1fr 1fr;
gap:12px;

}

.btn{

border:none;

border-radius:22px;

cursor:pointer;

font-family:inherit;

font-weight:800;

transition:.2s;

}

.btn:active{

transform:scale(.97);

}

.btn-check{

background:
linear-gradient(
135deg,
var(--green),
var(--green2)
);

padding:16px;

color:white;

}

.btn-reset{

background:white;

padding:16px;

border:
1.5px solid var(--border);

}

.btn-generate{

background:
linear-gradient(
135deg,
var(--primary2),
var(--primary)
);

padding:18px;

color:white;

font-size:1rem;

}

/* =======================
RESULT
======================= */

.result{

margin-top:16px;

padding:16px;

border-radius:22px;

background:#eef4ff;

text-align:center;

font-weight:700;

line-height:1.8;

}

/* =======================
INFO
======================= */

.info{

margin-top:16px;

background:#eef4ff;

padding:14px;

border-radius:22px;

display:flex;
justify-content:space-between;

font-weight:700;

}

/* =======================
PAGES
======================= */

.page{

display:none;

}

.page.active{

display:block;

}

/* =======================
MANAGER
======================= */

.page-title{

font-size:1.3rem;

font-weight:800;

margin-bottom:16px;

}

.search-input{

width:100%;

padding:14px;

border-radius:20px;

border:
1.5px solid var(--border);

margin-bottom:14px;

font-size:1rem;

}

.sentence-item{

background:#f8fbff;

padding:14px;

border-radius:20px;

margin-bottom:12px;

}

.sentence-text{

line-height:1.9;

margin-bottom:10px;

}

.sentence-actions{

display:flex;
gap:10px;

}

.action-btn{

flex:1;

padding:10px;

border:none;

border-radius:16px;

cursor:pointer;

font-weight:700;

}

.edit-btn{

background:#dbeafe;

}

.delete-btn{

background:#fee2e2;

}

.add-box{

display:flex;
gap:10px;

margin-bottom:18px;

}

.add-box input{

flex:1;

padding:14px;

border-radius:20px;

border:
1.5px solid var(--border);

}

.add-box button{

padding:14px 20px;

border:none;

border-radius:20px;

background:var(--primary);

color:white;

font-weight:700;

cursor:pointer;

}

/* =======================
SETTINGS
======================= */

.setting-box{

background:#f8fbff;

padding:18px;

border-radius:24px;

}

.setting-box input{

width:100%;

padding:16px;

border-radius:20px;

border:
1.5px solid var(--border);

margin-top:14px;
margin-bottom:14px;

font-size:1rem;

}

.setting-box button{

width:100%;

padding:16px;

border:none;

border-radius:20px;

background:var(--primary);

color:white;

font-weight:800;

cursor:pointer;

}

/* =======================
HIDDEN
======================= */

.hidden{

display:none;

}

/* =======================
MOBILE
======================= */

@media(max-width:520px){

.primary-buttons{

grid-template-columns:1fr;

}

.sentence-box{

font-size:1.1rem;

}

}

</style>

</head>

<body>

<!-- HEADER -->

<header class="header">

<button
class="menu-btn"
id="menuBtn">

☰

</button>

⌨️ تمرین تایپ حرفه‌ای

</header>

<!-- OVERLAY -->

<div id="overlay"></div>

<!-- SIDEBAR -->

<aside id="sidebar">

<div class="menu-title">

📋 منو

</div>

<button
class="menu-item"
onclick="showPage('practicePage')">

🏠 تمرین تایپ

</button>

<button
class="menu-item"
onclick="showPage('managerPage')">

📚 مدیریت جملات

</button>

<button
class="menu-item"
onclick="showPage('settingsPage')">

🎯 تنظیم مرحله

</button>

</aside>

<!-- MAIN -->

<div class="container">

<!-- PRACTICE -->

<section
id="practicePage"
class="page active">

<div class="card">

<div
class="sentence-box"
id="sentenceDisplay">

درحال بارگذاری...

</div>

<input
type="text"
class="user-input"
id="userInput"
placeholder="جمله را تایپ کن...">

<div class="action-section">

<div class="primary-buttons">

<button
class="btn btn-check"
id="checkBtn">

✔ بررسی

</button>

<button
class="btn btn-reset"
id="resetBtn">

↺ شروع دوباره

</button>

</div>

<button
class="btn btn-generate"
id="generateBtn">

✨ دریافت ۵۰ جمله جدید

</button>

</div>

<div
class="result"
id="resultMsg">

👆 جمله را تایپ کن

</div>

<div class="info">

<span id="progressText">

مرحله ۱

</span>

<span id="levelText">

سطح ۱

</span>

</div>

</div>

</section>

<!-- MANAGER -->

<section
id="managerPage"
class="page">

<div class="card">

<div class="page-title">

📚 مدیریت جملات

</div>

<input
type="text"
class="search-input"
id="searchInput"
placeholder="جستجو در جملات...">

<div class="add-box">

<input
type="text"
id="newSentenceInput"
placeholder="جمله جدید...">

<button
onclick="addSentence()">

➕

</button>

</div>

<div id="sentenceList"></div>

</div>

</section>

<!-- SETTINGS -->

<section
id="settingsPage"
class="page">

<div class="card">

<div class="page-title">

🎯 تنظیم مرحله

</div>

<div class="setting-box">

شماره مرحله را وارد کن

<input
type="number"
id="stepInput"
placeholder="مثلاً 25">

<button
onclick="jumpToStep()">

رفتن به مرحله

</button>

</div>

</div>

</section>

</div>

<script>

/* =====================
STORAGE
===================== */

const STORAGE_KEY =
"typing_sentences_pro";

const PROGRESS_KEY =
"typing_progress_pro";

const LEVEL_KEY =
"typing_level_pro";

/* =====================
STATE
===================== */

let sentences = [
"بابا آب داد",
"علی فوتبال بازی کرد",
"هوا امروز عالی است"
];

let currentIndex = 0;

let generationLevel = 1;

/* =====================
ELEMENTS
===================== */

const sentenceDisplay =
document.getElementById(
"sentenceDisplay"
);

const userInput =
document.getElementById(
"userInput"
);

const resultMsg =
document.getElementById(
"resultMsg"
);

const progressText =
document.getElementById(
"progressText"
);

const levelText =
document.getElementById(
"levelText"
);

const generateBtn =
document.getElementById(
"generateBtn"
);

/* =====================
SAVE / LOAD
===================== */

function saveData(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(sentences)
);

localStorage.setItem(
PROGRESS_KEY,
currentIndex
);

localStorage.setItem(
LEVEL_KEY,
generationLevel
);

}

function loadData(){

const saved =
localStorage.getItem(
STORAGE_KEY
);

if(saved){

sentences =
JSON.parse(saved);

}

const savedProgress =
localStorage.getItem(
PROGRESS_KEY
);

if(savedProgress){

currentIndex =
parseInt(savedProgress);

}

const savedLevel =
localStorage.getItem(
LEVEL_KEY
);

if(savedLevel){

generationLevel =
parseInt(savedLevel);

}

}

/* =====================
UI
===================== */

function updateUI(){

sentenceDisplay.innerText =
sentences[currentIndex];

progressText.innerText =
`مرحله ${currentIndex + 1}
از ${sentences.length}`;

levelText.innerText =
`سطح ${generationLevel}`;

userInput.value = "";

}

/* =====================
CHECK
===================== */

function checkAnswer(){

const typed =
userInput.value.trim();

const correct =
sentences[currentIndex];

if(typed === correct){

resultMsg.innerHTML =
"✅ عالی بود";

resultMsg.style.background =
"#dff7e7";

setTimeout(()=>{

currentIndex++;

if(
currentIndex >=
sentences.length
){

currentIndex = 0;

}

saveData();

updateUI();

},1000);

}else{

resultMsg.innerHTML =
`❌ پاسخ صحیح:
<br><br>
${correct}`;

resultMsg.style.background =
"#ffe3e3";

}

}

/* =====================
RESET
===================== */

function resetProgress(){

currentIndex = 0;

saveData();

updateUI();

}

/* =====================
GENERATE
===================== */

async function generateNewSentences(){

generateBtn.disabled = true;

resultMsg.innerHTML =
"🌐 درحال دریافت جملات...";

try{

let newSentences = [];

for(let i=0;i<5;i++){

const response =
await fetch(
"https://fa.wikipedia.org/w/api.php?action=query&generator=random&grnnamespace=0&prop=extracts&explaintext=1&exsentences=10&format=json&origin=*"
);

const data =
await response.json();

const pages =
data?.query?.pages;

if(!pages) continue;

Object.values(pages)
.forEach(page=>{

if(!page.extract) return;

const parts =
page.extract
.replace(/\n/g," ")
.split(/[.!؟]/);

parts.forEach(p=>{

const text =
p.trim();

if(
text.length > 25 &&
text.length < 140
){

newSentences.push(text);

}

});

});

}

newSentences =
[...new Set(newSentences)];

if(generationLevel >= 3){

newSentences =
newSentences.filter(
s=>s.length>50
);

}

if(generationLevel >= 5){

newSentences =
newSentences.filter(
s=>s.length>80
);

}

newSentences =
newSentences.slice(0,50);

sentences.push(
...newSentences
);

generationLevel++;

saveData();

resultMsg.innerHTML =
`🚀 ${newSentences.length}
جمله جدید اضافه شد`;

resultMsg.style.background =
"#dff7e7";

updateUI();

}catch(err){

console.error(err);

resultMsg.innerHTML =
"❌ خطا در دریافت";

resultMsg.style.background =
"#ffe3e3";

}

generateBtn.disabled = false;

}

/* =====================
PAGES
===================== */

function showPage(id){

document
.querySelectorAll(".page")
.forEach(p=>{

p.classList.remove(
"active"
);

});

document
.getElementById(id)
.classList.add("active");

closeMenu();

if(id==="managerPage"){

renderSentenceList();

}

}

/* =====================
MENU
===================== */

const sidebar =
document.getElementById(
"sidebar"
);

const overlay =
document.getElementById(
"overlay"
);

document
.getElementById("menuBtn")
.addEventListener(
"click",
()=>{

sidebar.classList.add(
"show"
);

overlay.classList.add(
"show"
);

}
);

overlay.addEventListener(
"click",
closeMenu
);

function closeMenu(){

sidebar.classList.remove(
"show"
);

overlay.classList.remove(
"show"
);

}

/* =====================
MANAGER
===================== */

function renderSentenceList(){

const list =
document.getElementById(
"sentenceList"
);

const search =
document
.getElementById(
"searchInput"
)
.value
.trim();

list.innerHTML = "";

sentences
.filter(s=>s.includes(search))
.forEach((sentence,index)=>{

const item =
document.createElement("div");

item.className =
"sentence-item";

item.innerHTML = `

<div class="sentence-text">

${sentence}

</div>

<div class="sentence-actions">

<button
class="action-btn edit-btn"
onclick="editSentence(${index})">

✏️ ویرایش

</button>

<button
class="action-btn delete-btn"
onclick="deleteSentence(${index})">

🗑 حذف

</button>

</div>

`;

list.appendChild(item);

});

}

document
.getElementById("searchInput")
.addEventListener(
"input",
renderSentenceList
);

function addSentence(){

const input =
document.getElementById(
"newSentenceInput"
);

const text =
input.value.trim();

if(!text) return;

sentences.push(text);

saveData();

renderSentenceList();

input.value = "";

}

function editSentence(index){

const updated =
prompt(
"ویرایش جمله:",
sentences[index]
);

if(updated){

sentences[index] =
updated;

saveData();

renderSentenceList();

updateUI();

}

}

function deleteSentence(index){

if(
confirm(
"حذف شود؟"
)
){

sentences.splice(index,1);

saveData();

renderSentenceList();

updateUI();

}

}

/* =====================
STEP SETTINGS
===================== */

function jumpToStep(){

const step =
parseInt(
document.getElementById(
"stepInput"
).value
);

if(
isNaN(step) ||
step < 1 ||
step > sentences.length
){

alert(
"شماره نامعتبر است"
);

return;

}

currentIndex =
step - 1;

saveData();

updateUI();

showPage(
"practicePage"
);

}

/* =====================
EVENTS
===================== */

document
.getElementById("checkBtn")
.addEventListener(
"click",
checkAnswer
);

document
.getElementById("resetBtn")
.addEventListener(
"click",
resetProgress
);

generateBtn
.addEventListener(
"click",
generateNewSentences
);

userInput.addEventListener(
"keypress",
e=>{

if(e.key==="Enter"){

checkAnswer();

}

}
);

/* =====================
START
===================== */

loadData();

updateUI();

</script>

</body>
</html>
