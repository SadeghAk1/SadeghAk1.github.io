<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
<title>تایپ حرفه‌ای | تمرین هوشمند</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', 'Tahoma', system-ui, sans-serif;
  background: linear-gradient(135deg, #eef2fa, #dfeaf5);
  min-height: 100vh;
  color: #1c2e4a;
}

/* HEADER - fixed with minimal padding (less than 1px is not practical, but set to minimum 2px) */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  background: #1f3b5c;
  padding: 4px 12px;
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  z-index: 1000;
  min-height: 46px;
}
.header h1 {
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: -0.2px;
}

/* آیکون همبرگر سمت راست */
.menu-btn {
  position: absolute;
  right: 10px;
  left: auto;
  width: 34px;
  height: 34px;
  border: none;
  border-radius: 12px;
  background: rgba(255,255,255,0.2);
  color: white;
  font-size: 1.2rem;
  cursor: pointer;
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.1s;
}
.menu-btn:active { transform: scale(0.96); }

/* مهم: فضای خالی برای جبران هدر fixed - این کار باعث می‌شود محتوا زیر هدر نرود */
.page-wrapper {
  padding-top: 54px;  /* ارتفاع هدر (46px) + فاصله بیشتر برای اطمینان */
  min-height: 100vh;
}

.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 6px 12px 30px;
}

.card {
  background: white;
  border-radius: 28px;
  padding: 14px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.04);
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(5px);}
  to { opacity: 1; transform: translateY(0);}
}

.hidden { display: none; }

/* بخش جمله با آیکون زوم */
.sentence-header-area {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: #eef3fc;
  border-radius: 32px;
  padding: 4px 8px 4px 4px;
  margin-bottom: 8px;
}
.target-sentence {
  background: transparent;
  padding: 4px 6px;
  font-size: 1.4rem;
  font-weight: 700;
  text-align: center;
  line-height: 1.3;
  letter-spacing: -0.2px;
  word-break: break-word;
  flex: 1;
  transition: all 0.2s ease;
}
/* کلاس بزرگ شده برای زوم */
.target-sentence.zoomed {
  font-size: 2.2rem;
  font-weight: 800;
  line-height: 1.4;
}
.zoom-icon {
  background: rgba(44,110,175,0.12);
  border: none;
  border-radius: 40px;
  width: 36px;
  height: 36px;
  font-size: 1.2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.1s;
  color: #1f4970;
  flex-shrink: 0;
}
.zoom-icon:active {
  transform: scale(0.92);
  background: #2c6eaf20;
}

.user-input {
  width: 100%;
  padding: 8px 14px;
  border-radius: 48px;
  border: 2px solid #d0e2f5;
  font-size: 1rem;
  outline: none;
  margin-bottom: 8px;
}
.user-input:focus { border-color: #2c6eaf; box-shadow: 0 0 0 3px rgba(44,110,175,0.1); }

.result-message {
  padding: 6px 12px;
  border-radius: 28px;
  text-align: center;
  font-weight: 600;
  background: #f0f5fe;
  margin-bottom: 10px;
  font-size: 0.85rem;
}

.buttons {
  display: flex;
  gap: 8px;
  margin-top: 4px;
}
.btn {
  border: none;
  padding: 8px 6px;
  border-radius: 40px;
  font-weight: 700;
  color: white;
  cursor: pointer;
  font-size: 0.85rem;
  transition: opacity 0.2s;
}
.btn:active { opacity: 0.8; }
.btn-check {
  flex: 2;
  background: linear-gradient(135deg, #1f9e5a, #15834b);
}
.btn-reset {
  flex: 1;
  background: linear-gradient(135deg, #f2a33e, #de7700);
}

.stats {
  margin-top: 8px;
  background: #eef2f9;
  padding: 6px 12px;
  border-radius: 28px;
  display: flex;
  justify-content: space-between;
  font-weight: 600;
  font-size: 0.8rem;
}

/* DRAWER (منوی همبرگری) */
.drawer {
  position: fixed;
  top: 0;
  right: -320px;
  width: 290px;
  height: 100%;
  background: white;
  padding: 24px 16px;
  box-shadow: -5px 0 30px rgba(0,0,0,0.1);
  transition: 0.25s ease;
  z-index: 2000;
  overflow-y: auto;
  border-radius: 28px 0 0 28px;
}
.drawer.show {
  right: 0;
}
.drawer h2 {
  margin-bottom: 20px;
  font-size: 1.3rem;
  font-weight: 700;
  border-right: 4px solid #2c6eaf;
  padding-right: 10px;
}
.menu-item {
  background: #f0f5fd;
  padding: 12px 14px;
  border-radius: 20px;
  margin-bottom: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.15s;
  display: flex;
  align-items: center;
  gap: 10px;
}
.menu-item:hover { background: #e2edff; transform: translateX(-3px);}
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: none;
  z-index: 1500;
}
.overlay.show { display: block; }

/* صفحه مدیریت جملات */
.page-title {
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 12px;
}
.search-area {
  margin-bottom: 12px;
}
#searchInput {
  width: 100%;
  padding: 8px 14px;
  border-radius: 40px;
  border: 1px solid #cbddee;
  font-size: 0.85rem;
  outline: none;
}
.add-sentence-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
  background: #f5f9ff;
  padding: 6px;
  border-radius: 60px;
}
.add-sentence-bar input {
  flex: 1;
  padding: 8px 14px;
  border-radius: 50px;
  border: 1px solid #c2d3e8;
  font-size: 0.85rem;
}
.add-sentence-bar button {
  background: #2c6eaf;
  border: none;
  border-radius: 50px;
  padding: 0 18px;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
.sentences-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 55vh;
  overflow-y: auto;
  padding-left: 2px;
}
.sentence-item {
  background: white;
  padding: 8px 12px;
  border-radius: 22px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  border: 1px solid #eef2f8;
}
.sentence-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
}
.sentence-index {
  font-weight: 800;
  background: #e2edfc;
  padding: 2px 10px;
  border-radius: 40px;
  font-size: 0.65rem;
  color: #1f4970;
}
.sentence-text {
  font-size: 0.9rem;
  line-height: 1.4;
  margin-bottom: 8px;
  word-break: break-word;
}
.item-actions {
  display: flex;
  gap: 8px;
}
.item-actions button {
  flex: 1;
  border: none;
  padding: 6px 0;
  border-radius: 32px;
  font-weight: 600;
  cursor: pointer;
  font-size: 0.7rem;
}
.edit-btn { background: #3584c7; color: white; }
.delete-btn { background: #e25c4a; color: white; }
.back-btn {
  margin-top: 16px;
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 32px;
  background: #254e77;
  color: white;
  font-weight: bold;
  cursor: pointer;
  font-size: 0.8rem;
}

/* صفحه تنظیمات */
.settings-title {
  font-size: 1.2rem;
  font-weight: 800;
  margin-bottom: 20px;
  border-right: 4px solid #2c6eaf;
  padding-right: 12px;
}
.step-selector {
  background: #f6faff;
  border-radius: 28px;
  padding: 16px;
  margin-bottom: 24px;
}
.step-selector label {
  font-weight: 700;
  display: block;
  margin-bottom: 10px;
}
.jump-group {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.jump-group input {
  flex: 2;
  padding: 10px 14px;
  border-radius: 60px;
  border: 1px solid #bfd4ec;
  font-size: 1rem;
  text-align: center;
}
.jump-group button {
  background: #2c6eaf;
  border: none;
  padding: 10px 18px;
  border-radius: 60px;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
.preview-sentence {
  background: #eef3fc;
  padding: 10px;
  border-radius: 28px;
  margin-top: 14px;
  font-size: 0.85rem;
  color: #1e4d7c;
}
.settings-back {
  margin-top: 10px;
  width: 100%;
  padding: 12px;
  background: #eef2fa;
  border: none;
  border-radius: 40px;
  font-weight: bold;
  cursor: pointer;
}

/* مدال مدرن */
.modal-modern {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: white;
  width: 86%;
  max-width: 360px;
  border-radius: 38px;
  padding: 20px 18px;
  z-index: 2100;
  box-shadow: 0 25px 45px rgba(0,0,0,0.25);
  text-align: center;
  animation: modalPop 0.2s ease;
  direction: rtl;
}
.modal-modern h3 {
  font-size: 1.3rem;
  margin-bottom: 12px;
}
.modal-modern input {
  width: 100%;
  padding: 10px 14px;
  border-radius: 60px;
  border: 1.5px solid #cddbe9;
  margin: 12px 0;
  font-size: 0.9rem;
}
.modal-buttons {
  display: flex;
  gap: 10px;
  margin-top: 8px;
}
.modal-buttons button {
  flex: 1;
  padding: 8px;
  border-radius: 50px;
  font-weight: bold;
  border: none;
  cursor: pointer;
}
.modal-confirm { background: #2c6eaf; color: white; }
.modal-cancel { background: #e2e8f0; color: #2d3e5f; }
@keyframes modalPop {
  from { opacity: 0; transform: translate(-50%, -48%) scale(0.96);}
  to { opacity: 1; transform: translate(-50%, -50%) scale(1);}
}
.backdrop-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(3px);
  z-index: 2050;
}

/* اسکرول روان */
html {
  scroll-behavior: smooth;
}
</style>
</head>
<body>

<div class="header">
  <button class="icon-btn menu-btn" id="menuBtn">☰</button>
  <h1>⌨️ تمرین تایپ حرفه‌ای</h1>
</div>

<div class="page-wrapper">
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <h2>📋 منو</h2>
  <div class="menu-item" id="managementMenu">📚 مدیریت جملات</div>
  <div class="menu-item" id="settingsMenuBtn">⚙️ تنظیمات (شماره مرحله)</div>
</div>

<div class="container">
  <!-- صفحه اصلی تمرین -->
  <div class="card" id="practicePage">
    <div class="sentence-header-area">
      <div class="target-sentence" id="sentenceDisplay"></div>
      <button class="zoom-icon" id="zoomBtn" title="بزرگنمایی جمله">🔍</button>
    </div>
    <input type="text" id="userInput" class="user-input" placeholder="جمله را تایپ کن ...">
    <div class="result-message" id="resultMsg">👆 جمله را تایپ و چک کن</div>
    <div class="buttons">
      <button class="btn btn-check" id="checkBtn">✔ چک کن</button>
      <button class="btn btn-reset" id="resetBtn">🔄 از اول</button>
    </div>
    <div class="stats">
      <span>📖 پیشرفت</span>
      <span id="progressText"></span>
    </div>
  </div>

  <!-- صفحه مدیریت جملات -->
  <div class="card hidden" id="sentencesPage">
    <div class="page-title">📚 مدیریت جملات</div>
    <div class="search-area">
      <input type="text" id="searchInput" placeholder="🔍 جستجوی حرفه‌ای (بخشی از جمله...)">
    </div>
    <div class="add-sentence-bar">
      <input type="text" id="newSentenceField" placeholder="جمله جدید بنویس ...">
      <button id="addNewSentenceBtn">➕ افزودن</button>
    </div>
    <div class="sentences-list" id="sentencesList"></div>
    <button class="back-btn" id="backBtn">← بازگشت به تمرین</button>
  </div>

  <!-- صفحه تنظیمات -->
  <div class="card hidden" id="settingsPage">
    <div class="settings-title">⚙️ تنظیم شماره مرحله</div>
    <div class="step-selector">
      <label>شماره جمله مورد نظر را وارد کنید (از ۱ تا <span id="totalSentencesCount"></span>)</label>
      <div class="jump-group">
        <input type="number" id="settingsStepInput" min="1" placeholder="مثال: ۱۲">
        <button id="applySettingsBtn">تنظیم و شروع تمرین</button>
      </div>
      <div id="settingsPreview" class="preview-sentence hidden"></div>
    </div>
    <button class="settings-back" id="settingsBackBtn">↩ بازگشت به تمرین</button>
  </div>
</div>
</div>

<script>
// ==================== ۵۰ جمله آسان به سخت با نام‌های مشخص ====================
const SEED_SENTENCES = [
  "بابا آب داد", "مادر نان خرید", "سارا خندید", "دهپور آمد مدرسه", "علی فوتبال بازی کرد",
  "هوا خیلی خوب است", "صادق مداد دارد", "روح الله توپ قرمز خرید", "صبورا گلدان زیبا شکست", "میترا کتاب خواند",
  "لیلا نقاشی کشید", "دهپور دوچرخه سواری کرد", "صادق بستنی خورد", "روح الله به مادر کمک کرد", "صبورا مشق نوشت",
  "میترا آب آورد", "لیلا گل کاشت", "دهپور به مسجد رفت", "صادق نماز خواند", "روح الله ورزش کرد",
  "صبورا آشپزی کرد", "میترا خیاطی می‌کند", "لیلا با عروسک بازی کرد", "دهپور مهربان است", "صادق زحمتکش است",
  "روح الله باهوش بود", "صبورا نقاش ماهری شد", "میترا جواب درست داد", "لیلا کار گروهی انجام داد", "دهپور رهبر کلاس شد",
  "صادق به سوال سخت جواب داد", "روح الله برنامه کامپیوتر نوشت", "صبورا آزمایش علمی انجام داد", "میترا انشای زیبا نوشت", "لیلا ریاضی را عالی فهمید",
  "دهپور در مسابقه برنده شد", "صادق کتاب داستان هدیه گرفت", "روح الله تخته سیاه را پاک کرد", "صبورا در باغچه گل کاشت", "میترا به همکلاسی کمک کرد",
  "لیلا نمایشنامه زیبا خواند", "دهپور دوست وفادار است", "صادق ورزش را دوست دارد", "روح الله به طبیعت سفر کرد", "صبورا مسئول کتابخانه شد",
  "میترا در جشن مدرسه آواز خواند", "لیلا مقام اول ریاضی گرفت", "دهپور حافظ کل قرآن شد", "همه به دهپور افتخار می‌کنند", "صبورا و میترا باهم بازی کردند", "صادق و روح الله رفیق صمیمی هستند"
];

const STORAGE_KEY = "typing_spa_final_sentences";
const PROGRESS_KEY = "typing_spa_final_index";

let sentences = [];
let currentIndex = 0;
let filterText = "";
let isWaitingForNext = false;

// --- DOM elements ---
const sentenceDisplay = document.getElementById('sentenceDisplay');
const zoomBtn = document.getElementById('zoomBtn');
const userInput = document.getElementById('userInput');
const resultMsg = document.getElementById('resultMsg');
const progressText = document.getElementById('progressText');
const checkBtn = document.getElementById('checkBtn');
const resetBtn = document.getElementById('resetBtn');
const practicePage = document.getElementById('practicePage');
const sentencesPage = document.getElementById('sentencesPage');
const settingsPage = document.getElementById('settingsPage');
const menuBtn = document.getElementById('menuBtn');
const drawer = document.getElementById('drawer');
const overlay = document.getElementById('overlay');
const managementMenu = document.getElementById('managementMenu');
const settingsMenuBtn = document.getElementById('settingsMenuBtn');
const backBtn = document.getElementById('backBtn');
const sentencesListDiv = document.getElementById('sentencesList');
const searchInput = document.getElementById('searchInput');
const newSentenceField = document.getElementById('newSentenceField');
const addNewSentenceBtn = document.getElementById('addNewSentenceBtn');
const settingsStepInput = document.getElementById('settingsStepInput');
const applySettingsBtn = document.getElementById('applySettingsBtn');
const settingsPreview = document.getElementById('settingsPreview');
const settingsBackBtn = document.getElementById('settingsBackBtn');
const totalSentencesCountSpan = document.getElementById('totalSentencesCount');

// --- Zoom functionality ---
let isZoomed = false;
function toggleZoom() {
  if (isZoomed) {
    sentenceDisplay.classList.remove('zoomed');
    zoomBtn.style.background = 'rgba(44,110,175,0.12)';
    zoomBtn.innerHTML = '🔍';
  } else {
    sentenceDisplay.classList.add('zoomed');
    zoomBtn.style.background = '#2c6eaf30';
    zoomBtn.innerHTML = '🔍−';
  }
  isZoomed = !isZoomed;
}
zoomBtn.addEventListener('click', toggleZoom);

// --- Helpers storage ---
function saveSentences() { localStorage.setItem(STORAGE_KEY, JSON.stringify(sentences)); }
function loadSentences() {
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored && JSON.parse(stored).length > 0) {
    sentences = JSON.parse(stored);
  } else {
    sentences = [...SEED_SENTENCES];
    saveSentences();
  }
  if (totalSentencesCountSpan) totalSentencesCountSpan.innerText = sentences.length;
}
function saveProgress() { localStorage.setItem(PROGRESS_KEY, currentIndex); }
function loadProgress() {
  const saved = localStorage.getItem(PROGRESS_KEY);
  currentIndex = saved ? parseInt(saved) : 0;
  if (currentIndex >= sentences.length) currentIndex = 0;
}

function updateUIFromIndex() {
  if (!sentences.length) return;
  sentenceDisplay.innerText = sentences[currentIndex];
  progressText.innerText = `جمله ${currentIndex+1} از ${sentences.length}`;
  userInput.value = '';
  resultMsg.innerHTML = '✍️ جمله جدید رو تایپ کن';
  resultMsg.style.background = '#f0f5fe';
  userInput.focus();
  isWaitingForNext = false;
}

// چک کردن با تأخیر ۳ ثانیه
function checkAnswer() {
  if (isWaitingForNext) return;
  
  const typed = userInput.value.trim();
  if (typed === sentences[currentIndex]) {
    resultMsg.innerHTML = '✅ عالی بود! جمله درست ✅';
    resultMsg.style.background = '#d5f5e3';
    isWaitingForNext = true;
    
    setTimeout(() => {
      currentIndex++;
      if (currentIndex >= sentences.length) {
        currentIndex = 0;
      }
      saveProgress();
      updateUIFromIndex();
    }, 3000);
  } else {
    resultMsg.innerHTML = `❌ جمله درست: «${sentences[currentIndex]}»`;
    resultMsg.style.background = '#ffe0e0';
  }
}

function resetProgress() {
  if (isWaitingForNext) return;
  currentIndex = 0;
  saveProgress();
  updateUIFromIndex();
}

// ---- مدیریت جملات ----
function renderSentencesList() {
  let filtered = [...sentences];
  if (filterText.trim() !== "") {
    filtered = sentences.filter(s => s.includes(filterText));
  }
  sentencesListDiv.innerHTML = "";
  filtered.forEach((sentence) => {
    const originalIndex = sentences.findIndex(s => s === sentence);
    const realNumber = originalIndex + 1;
    const item = document.createElement('div');
    item.className = 'sentence-item';
    item.innerHTML = `
      <div class="sentence-header">
        <span class="sentence-index">#${realNumber}</span>
      </div>
      <div class="sentence-text">${escapeHtml(sentence)}</div>
      <div class="item-actions">
        <button class="edit-btn" data-index="${originalIndex}">✏️ ویرایش</button>
        <button class="delete-btn" data-index="${originalIndex}">🗑️ حذف</button>
      </div>
    `;
    sentencesListDiv.appendChild(item);
  });

  document.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const idx = parseInt(btn.dataset.index);
      openModernEditModal(idx);
    });
  });
  document.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const idx = parseInt(btn.dataset.index);
      openModernDeleteModal(idx);
    });
  });
}

function escapeHtml(str) {
  return str.replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  });
}

function addNewSentenceFromManager() {
  const newText = newSentenceField.value.trim();
  if (!newText) return;
  sentences.push(newText);
  saveSentences();
  renderSentencesList();
  updateUIFromIndex();
  if (totalSentencesCountSpan) totalSentencesCountSpan.innerText = sentences.length;
  newSentenceField.value = '';
}

function openModernEditModal(index) {
  const oldText = sentences[index];
  const modalDiv = document.createElement('div');
  modalDiv.className = 'backdrop-modal';
  const modalCard = document.createElement('div');
  modalCard.className = 'modal-modern';
  modalCard.innerHTML = `
    <h3>✏️ ویرایش جمله</h3>
    <input type="text" id="editSentenceInput" value="${escapeHtml(oldText)}" autofocus>
    <div class="modal-buttons">
      <button class="modal-confirm" id="confirmEditBtn">ذخیره</button>
      <button class="modal-cancel" id="cancelModalBtn">انصراف</button>
    </div>
  `;
  modalDiv.appendChild(modalCard);
  document.body.appendChild(modalDiv);
  const closeModal = () => modalDiv.remove();
  modalCard.querySelector('#confirmEditBtn').onclick = () => {
    const newVal = modalCard.querySelector('#editSentenceInput').value.trim();
    if (newVal) {
      sentences[index] = newVal;
      saveSentences();
      if (currentIndex === index) updateUIFromIndex();
      renderSentencesList();
      if (totalSentencesCountSpan) totalSentencesCountSpan.innerText = sentences.length;
    }
    closeModal();
  };
  modalCard.querySelector('#cancelModalBtn').onclick = closeModal;
  modalDiv.addEventListener('click', (e) => { if (e.target === modalDiv) closeModal(); });
}

function openModernDeleteModal(index) {
  const modalDiv = document.createElement('div');
  modalDiv.className = 'backdrop-modal';
  const modalCard = document.createElement('div');
  modalCard.className = 'modal-modern';
  modalCard.innerHTML = `
    <h3>⚠️ حذف جمله</h3>
    <p style="margin-bottom: 12px;">مطمئنی جمله «${escapeHtml(sentences[index])}» حذف بشه؟</p>
    <div class="modal-buttons">
      <button class="modal-confirm" id="confirmDelBtn">بله، حذف کن</button>
      <button class="modal-cancel" id="cancelModalBtn">لغو</button>
    </div>
  `;
  modalDiv.appendChild(modalCard);
  document.body.appendChild(modalDiv);
  const close = () => modalDiv.remove();
  modalCard.querySelector('#confirmDelBtn').onclick = () => {
    sentences.splice(index, 1);
    if (sentences.length === 0) sentences = ["جمله نمونه"];
    if (currentIndex >= sentences.length) currentIndex = 0;
    saveSentences();
    saveProgress();
    updateUIFromIndex();
    renderSentencesList();
    if (totalSentencesCountSpan) totalSentencesCountSpan.innerText = sentences.length;
    close();
  };
  modalCard.querySelector('#cancelModalBtn').onclick = close;
  modalDiv.addEventListener('click', (e) => { if (e.target === modalDiv) close(); });
}

// جستجو
searchInput.addEventListener('input', (e) => {
  filterText = e.target.value;
  renderSentencesList();
});

// تنظیمات
function updateSettingsPreview() {
  const stepVal = parseInt(settingsStepInput.value);
  if (!isNaN(stepVal) && stepVal >= 1 && stepVal <= sentences.length) {
    const target = sentences[stepVal-1];
    settingsPreview.innerText = `📌 جمله انتخابی: ${target}`;
    settingsPreview.classList.remove('hidden');
  } else {
    settingsPreview.classList.add('hidden');
  }
}
settingsStepInput.addEventListener('input', updateSettingsPreview);
applySettingsBtn.addEventListener('click', () => {
  if (isWaitingForNext) return;
  let step = parseInt(settingsStepInput.value);
  if (isNaN(step)) step = 1;
  if (step < 1) step = 1;
  if (step > sentences.length) step = sentences.length;
  currentIndex = step - 1;
  saveProgress();
  updateUIFromIndex();
  resultMsg.innerHTML = `🔁 مرحله ${step} تنظیم شد: «${sentences[currentIndex]}»`;
  resultMsg.style.background = "#e0f0ff";
  showPractice();
});

// نمایش صفحات
function showPractice() {
  practicePage.classList.remove('hidden');
  sentencesPage.classList.add('hidden');
  settingsPage.classList.add('hidden');
  updateUIFromIndex();
  closeDrawer();
}
function showManagement() {
  if (isWaitingForNext) return;
  practicePage.classList.add('hidden');
  sentencesPage.classList.remove('hidden');
  settingsPage.classList.add('hidden');
  filterText = "";
  if(searchInput) searchInput.value = "";
  renderSentencesList();
  closeDrawer();
}
function showSettings() {
  if (isWaitingForNext) return;
  practicePage.classList.add('hidden');
  sentencesPage.classList.add('hidden');
  settingsPage.classList.remove('hidden');
  if(totalSentencesCountSpan) totalSentencesCountSpan.innerText = sentences.length;
  settingsStepInput.value = currentIndex + 1;
  updateSettingsPreview();
  closeDrawer();
}
function openDrawer() { drawer.classList.add('show'); overlay.classList.add('show'); }
function closeDrawer() { drawer.classList.remove('show'); overlay.classList.remove('show'); }

// رویدادها
menuBtn.addEventListener('click', openDrawer);
overlay.addEventListener('click', closeDrawer);
managementMenu.addEventListener('click', showManagement);
settingsMenuBtn.addEventListener('click', showSettings);
backBtn.addEventListener('click', showPractice);
settingsBackBtn.addEventListener('click', showPractice);
checkBtn.addEventListener('click', checkAnswer);
resetBtn.addEventListener('click', resetProgress);
userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') checkAnswer(); });
addNewSentenceBtn.addEventListener('click', addNewSentenceFromManager);
newSentenceField.addEventListener('keypress', (e) => { if (e.key === 'Enter') addNewSentenceFromManager(); });

// مقداردهی اولیه
loadSentences();
loadProgress();
updateUIFromIndex();
renderSentencesList();
if(totalSentencesCountSpan) totalSentencesCountSpan.innerText = sentences.length;
settingsStepInput.value = currentIndex + 1;
updateSettingsPreview();
</script>
</body>
</html>
